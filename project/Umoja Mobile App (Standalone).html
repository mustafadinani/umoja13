document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

erif;color:rgba(0,0,0,.5)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section class=\"dv-turn\" id=\"t1\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t1\">1<\u002Fa><span class=\"dv-tname\">Umoja Games — mobile app<\u002Fspan><\u002Fdiv>\n<p class=\"dv-note\">Design intent: personal-first (\"my team, my games, my moments\"), big touch targets, plain friendly language, match-day energy from the logo's gradient palette. <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa> is the fully interactive prototype — tap tabs, open the live game, cheer, vote, upload a moment, run check-in to get your Tournament Pass, and try the captain's roster view. <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa> and <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa> are two alternate visual directions of the home screen.<\u002Fp>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"1a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>Match Day — interactive prototype (light, gradient energy)<\u002Fdiv>\n<x-import component-from-global-scope=\"IOSDevice\" from=\"f1d5cc6b-400c-45c8-9975-b0d4029a4c4c#/ios-frame.jsx\" hint-size=\"393px,830px\">\n<div style=\"position:relative;height:100%;display:flex;flex-direction:column;background:#F7F6F3;font-family:'Barlow',sans-serif;color:#211A33;overflow:hidden\" data-screen-label=\"Mobile app\">\n\n  <!-- ============ HOME TAB ============ -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column\" data-screen-label=\"Home\">\n    <div style=\"background:linear-gradient(120deg,#7B3FA4 0%,#2E6BC0 100%);padding:62px 20px 22px;color:#fff\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between\">\n        <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:22px;letter-spacing:1px\">UMOJA GAMES<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <div style=\"font-size:12px;font-weight:600;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:99px\">Day 1 · Seeding<\u002Fdiv>\n          <div onclick=\"{{ openNotifs }}\" style=\"position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px\">🔔\n            <sc-if value=\"{{ hasUnread }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:#F2B95B;border:2px solid #5A55A8\"><\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;font-family:'Barlow Condensed';font-weight:700;font-size:30px;line-height:1.05\">Good morning, Kwame.<\u002Fdiv>\n      <div style=\"margin-top:4px;font-size:14px;opacity:.85\">Your game is at 10:40 AM on Field 3.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showCheckinBanner }}\" hint-placeholder-val=\"{{ true }}\">\n    <div onclick=\"{{ startCheckin }}\" style=\"margin:-12px 16px 0;background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(33,26,51,.12);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer\">\n      <div style=\"width:42px;height:42px;border-radius:12px;background:#FBEEDC;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;color:#B97514\">!<\u002Fdiv>\n      <div style=\"flex:1\">\n        <div style=\"font-weight:700;font-size:15px\">Finish your check-in<\u002Fdiv>\n        <div style=\"font-size:13px;color:#6F6981\">Selfie + ID — about 2 minutes, then admins approve your Pass<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:16px;color:#7B3FA4\">GO<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ showPendingBanner }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ goMe }}\" style=\"margin:- 12px;color:#6F6981\">Highlights<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px 16px 8px;font-family:'Barlow Condensed';font-weight:800;font-size:19px\">BADGES<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;padding:0 16px;flex-wrap:wrap\">\n      <sc-for list=\"{{ viewPlayer.badges }}\" as=\"b\" hint-placeholder-count=\"2\">\n        <div style=\"background:#FBEEDC;color:#B97514;font-weight:700;font-size:12.5px;padding:8px 13px;border-radius:99px\">{{ b }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"padding:16px 16px 8px;font-family:'Barlow Condensed';font-weight:800;font-size:19px\">TAGGED MOMENTS<\u002Fdiv>\n    <div style=\"display:flex;gap:10px;overflow-x:auto;padding:0 16px 20px\">\n      <sc-for list=\"{{ gameMoments }}\" as=\"m\" hint-placeholder-count=\"2\">\n        <div style=\"flex:none;width:140px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid #EAE7F0\">\n          <div style=\"height:90px;background:{{ m.bg }};display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:1px\">{{ m.tag }}<\u002Fdiv>\n          <div style=\"padding:8px 10px\"><div style=\"font-size:12px;font-weight:600\">{{ m.caption }}<\u002Fdiv><div style=\"font-size:11px;color:#6F6981\">{{ m.by }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ CHECK-IN FLOW ============ -->\n  <sc-if value=\"{{ isCheckin }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;overflow-y:auto;background:#F7F6F3;display:flex;flex-direction:column\" data-screen-label=\"Check-in\">\n    <div style=\"padding:58px 16px 0\">\n      <div onclick=\"{{ back }}\" style=\"font-size:14px;font-weight:600;color:#6F6981;cursor:pointer;margin-bottom:12px\">‹ Not now<\u002Fdiv>\n      <div style=\"display:flex;gap:6px;margin-bottom:18px\">\n        <sc-for list=\"{{ checkinDots }}\" as=\"d\" hint-placeholder-count=\"4\"><div style=\"flex:1;height:5px;border-radius:99px;background:{{ d.bg }}\"><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ ciStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding:0 20px\">\n        <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:30px;line-height:1.05\">Is this you?<\u002Fdiv>\n        <div style=\"font-size:14px;color:#6F6981;margin:6px 0 18px\">Your captain added you to the roster. Give it a quick look.<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #EAE7F0;border-radius:16px;padding:6px 16px\">\n          <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F1EFF5\"><span style=\"color:#6F6981;font-size:13.5px\">Name<\u002Fspan><span style=\"font-weight:600;font-size:14px\">Kwame Mensah<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F1EFF5\"><span style=\"color:#6F6981;font-size:13.5px\">Team<\u002Fspan><span style=\"font-weight:600;font-size:14px\">DMV United<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F1EFF5\"><span style=\"color:#6F6981;font-size:13.5px\">Category<\u002Fspan><span style=\"font-weight:600;font-size:14px\">Men's Open · 9v9<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F1EFF5\"><span style=\"color:#6F6981;font-size:13.5px\">Jersey<\u002Fspan><span style=\"font-weight:600;font-size:14px\">#10<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:12px 0\"><span style=\"color:#6F6981;font-size:13.5px\">Waiver<\u002Fspan><span style=\"font-weight:600;font-size:14px;color:#1E7A6F\">Signed at registration ✓<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div onclick=\"{{ ciNext }}\" style=\"margin-top:18px;background:linear-gradient(120deg,#7B3FA4,#2E6BC0);color:#fff;border-radius:14px;padding:16px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer\">YES, THAT'S ME<\u002Fdiv>\n        <div style=\"text-align:center;margin-top:12px;font-size:13px;color:#6F6981;cursor:pointer\">Something's wrong — tell my captain<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ ciStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:0 20px\">\n        <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:30px;line-height:1.05\">Take a quick selfie<\u002Fdiv>\n        <div style=\"font-size:14px;color:#6F6981;margin:6px 0 18px\">Staff match it to your Tournament Pass at the gate.<\u002Fdiv>\n        <sc-if value=\"{{ selfieNotTaken }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"width:190px;height:190px;margin:6px auto 16px;border-radius:50%;border:2px dashed #C9C3D8;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px\">\n            <div style=\"width:44px;height:44px;border-radius:50%;background:#EFE6F6;display:flex;align-items:center;justify-content:center;color:#7B3FA4;font-family:'Barlow Condensed';font-weight:800;font-size:18px\">◉<\u002Fdiv>\n            <div style=\"font-size:12px;color:#9C96AE;font-family:ui-monospace,monospace\">camera preview<\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ takeSelfie }}\" style=\"background:linear-gradient(120deg,#7B3FA4,#2E6BC0);color:#fff;border-radius:14px;padding:16px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer\">TAKE SELFIE<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ selfieTaken }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"width:190px;height:190px;margin:6px auto 10px;border-radius:50%;background:linear-gradient(135deg,#7B3FA4,#2E6BC0);border:4px solid #F2B95B;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:56px;animation:umPop .35s\">KM<\u002Fdiv>\n          <div onclick=\"{{ retakeSelfie }}\" style=\"text-align:center;font-size:13.5px;font-weight:600;color:#2E6BC0;cursor:pointer;margin-bottom:14px\">Retake<\u002Fdiv>\n          <div onclick=\"{{ ciNext }}\" style=\"background:linear-gradient(120deg,#7B3FA4,#2E6BC0);color:#fff;border-radius:14px;padding:16px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer\">LOOKS GOOD — CONTINUE<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ ciStep3 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:0 20px\">\n        <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:30px;line-height:1.05\">Snap your government ID<\u002Fdiv>\n        <div style=\"font-size:14px;color:#6F6981;margin:6px 0 18px\">For age verification only. Only admins and the commissioner can see it, and it's deleted after the tournament.<\u002Fdiv>\n        <sc-if value=\"{{ idNotTaken }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"height:170px;margin:6px 0 16px;border-radius:16px;border:2px dashed #C9C3D8;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px\">\n            <div style=\"width:44px;height:32px;border-radius:6px;background:#E4EDF9;border:1.5px solid #2E6BC0\"><\u002Fdiv>\n            <div style=\"font-size:12px;color:#9C96AE;font-family:ui-monospace,monospace\">driver's license · passport · state ID<\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ takeId }}\" style=\"background:linear-gradient(120deg,#7B3FA4,#2E6BC0);color:#fff;border-radius:14px;padding:16px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer\">TAKE PHOTO OF ID<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ idTaken }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"height:170px;margin:6px 0 10px;border-radius:16px;background:#211A33;padding:18px;box-sizing:border-box;display:flex;gap:16px;align-items:center;animation:umPop .35s\">\n            <div style=\"width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#7B3FA4,#2E6BC0);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:22px\">KM<\u002Fdiv>\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:9px\">\n              <div style=\"height:11px;width:70%;border-radius:99px;background:rgba(255,255,255,.35)\"><\u002Fdiv>\n              <div style=\"height:11px;width:50%;border-radius:99px;background:rgba(255,255,255,.22)\"><\u002Fdiv>\n              <div style=\"height:11px;width:60%;border-radius:99px;background:rgba(255,255,255,.22)\"><\u002Fdiv>\n              <div style=\"font-size:11px;color:#F2B95B;font-family:ui-monospace,monospace;margin-top:2px\">captured · encrypted<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ retakeId }}\" style=\"text-align:center;font-size:13.5px;font-weight:600;color:#2E6BC0;cursor:pointer;margin-bottom:14px\">Retake<\u002Fdiv>\n          <div onclick=\"{{ submitCheckin }}\" style=\"background:linear-gradient(120deg,#7B3FA4,#2E6BC0);color:#fff;border-radius:14px;padding:16px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer\">SUBMIT FOR REVIEW<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ ciStep4 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:0 20px;text-align:center\">\n\n        <sc-if value=\"{{ ciVerifying }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"width:58px;height:58px;margin:14px auto 16px;border-radius:50%;border:4px solid #EFE6F6;border-top-color:#7B3FA4;animation:umSpin .9s linear infinite\"><\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:28px\">Checking your details…<\u002Fdiv>\n          <div style=\"font-size:14px;color:#6F6981;margin:8px 0 18px;line-height:1.5\">Matching your selfie to your registration photo<br>and reading the date of birth on your ID.<\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #EAE7F0;border-radius:14px;padding:6px 16px;text-align:left\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #F1EFF5;font-size:13.5px\"><span>Photo matches registration<\u002Fspan><span style=\"color:#9C96AE;font-family:ui-monospace,monospace;font-size:11px\">checking…<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:13.5px\"><span>Age eligible for Men's Open<\u002Fspan><span style=\"color:#9C96AE;font-family:ui-monospace,monospace;font-size:11px\">checking…<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ ciFailed }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"width:64px;height:64px;margin:10px auto 14px;border-radius:50%;background:#FBE3DF;color:#C0392B;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:26px\">✕<\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:28px\">We couldn't verify you<\u002Fdiv>\n          <div style=\"font-size:14px;color:#6F6981;margin:6px 0 14px\">No worries — this is usually the lighting. Try again.<\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #EAE7F0;border-radius:14px;padding:6px 16px;text-align:left\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #F1EFF5;font-size:13.5px\"><span>Photo matches registration<\u002Fspan><span style=\"font-weight:700;color:#C0392B\">✕ {{ ciFailReason }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:13.5px\"><span>Age eligible for Men's Open<\u002Fspan><span style=\"font-weight:700;color:#1E7A6F\">✓ Verified<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ ciResubmit }}\" style=\"margin-top:16px;background:linear-gradient(120deg,#7B3FA4,#2E6BC0);color:#fff;border-radius:14px;padding:16px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer\">RETAKE &amp; RESUBMIT<\u002Fdiv>\n          <div style=\"margin-top:12px;font-size:12.5px;color:#6F6981;line-height:1.5\">{{ ciAttemptNote }}<\u002Fdiv>\n          <div onclick=\"{{ failAgainDemo }}\" style=\"margin-top:10px;font-size:12px;color:#9C96AE;cursor:pointer;font-family:ui-monospace,monospace\">prototype: fail again → admin review<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ ciAdminReview }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"width:64px;height:64px;margin:10px auto 14px;border-radius:50%;background:#FBEEDC;display:flex;align-items:center;justify-content:center\"><span style=\"width:16px;height:16px;border-radius:50%;background:#F2A93B;animation:umPulse 1.6s infinite\"><\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:28px\">Sent to an admin<\u002Fdiv>\n          <div style=\"font-size:14px;color:#6F6981;margin:6px 0 16px;line-height:1.5\">The automatic check didn't go through twice, so a real person will review your photos and ID. You'll get a notification with their decision — usually within the hour.<\u002Fdiv>\n          <div style=\"background:#211A33;border-radius:18px;padding:18px;color:#fff\">\n            <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:16px;letter-spacing:2px;color:#F2B95B\">TOURNAMENT PASS<\u002Fdiv>\n            <div style=\"margin:12px auto;width:140px;height:140px;background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px\">\n              <span style=\"width:12px;height:12px;border-radius:50%;background:#F2A93B;animation:umPulse 1.6s infinite\"><\u002Fspan>\n              <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:15px;letter-spacing:2px;color:#B97514\">ADMIN REVIEW<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-weight:700;font-size:14.5px\">Kwame Mensah · DMV United · Men's Open<\u002Fdiv>\n            <div style=\"font-size:12px;opacity:.7;margin-top:2px\">Your QR code appears if the admin approves your check-in<\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ ciDone }}\" style=\"margin-top:16px;background:linear-gradient(120deg,#7B3FA4,#2E6BC0);color:#fff;border-radius:14px;padding:16px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer\">DONE<\u002Fdiv>\n          <div onclick=\"{{ approveDemo }}\" style=\"margin-top:12px;font-size:12px;color:#9C96AE;cursor:pointer;font-family:ui-monospace,monospace\">prototype: simulate admin approval →<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ ciApprovedStep }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"width:64px;height:64px;margin:10px auto 14px;border-radius:50%;background:#E2F2EF;color:#2C9C90;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:28px;animation:umPop .4s\">✓<\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:30px\">You're cleared to play!<\u002Fdiv>\n          <div style=\"font-size:14px;color:#6F6981;margin:6px 0 8px\">Photo matched ✓ · Age verified ✓<br>Here's your Tournament Pass — show it at the gate on Friday.<\u002Fdiv>\n          <div style=\"background:#211A33;border-radius:18px;padding:18px;color:#fff\">\n            <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:16px;letter-spacing:2px;color:#F2B95B\">TOURNAMENT PASS<\u002Fdiv>\n            <div style=\"width:60px;height:60px;margin:12px auto 0;border-radius:50%;background:linear-gradient(135deg,#7B3FA4,#2E6BC0);border:3px solid #F2B95B;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:22px\">KM<\u002Fdiv>\n            <div style=\"margin:10px auto 12px;width:140px;height:140px;background:#fff;border-radius:12px;padding:11px;box-sizing:border-box;display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(13,1fr);gap:1px\">\n              <sc-for list=\"{{ qrCells }}\" as=\"c\" hint-placeholder-count=\"30\"><div style=\"background:{{ c.bg }}\"><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-weight:700;font-size:14.5px\">Kwame Mensah · DMV United · Men's Open<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;background:#FBEEDC;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#8A5A0F;line-height:1.5;text-align:left\">Heads up: admins may randomly re-check verifications. If yours doesn't hold up, your check-in can be nullified — we'd notify you right away.<\u002Fdiv>\n          <div onclick=\"{{ ciDone }}\" style=\"margin-top:14px;background:linear-gradient(120deg,#7B3FA4,#2E6BC0);color:#fff;border-radius:14px;padding:16px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer\">DONE<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"height:24px\"><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCAVENGER HUNT ============ -->\n  <sc-if value=\"{{ isHunt }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;overflow-y:auto;position:relative\" data-screen-label=\"Scavenger hunt\">\n\n    <!-- Not joined: intro + create crew -->\n    <sc-if value=\"{{ huntIntro }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#211A33;color:#fff;padding:58px 20px 22px\">\n        <div onclick=\"{{ back }}\" style=\"font-size:14px;font-weight:600;opacity:.8;cursor:pointer;margin-bottom:10px\">‹ Back<\u002Fdiv>\n        <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:32px;color:#F2B95B\">THE HUNT<\u002Fdiv>\n        <div style=\"font-size:14px;opacity:.9;margin-top:4px;line-height:1.5\">45 missions across 3 days. Photos, videos, trivia, QR scans and check-ins — earn points, climb the board, win prizes.<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:14px;flex-wrap:wrap\">\n          <div style=\"background:rgba(255,255,255,.12);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600\">📸 Photo<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.12);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600\">🎥 Video<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.12);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600\">🧠 Trivia<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.12);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600\">📍 Check-in<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.12);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600\">🔲 QR scan<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 20px 4px\">\n        <div style=\"background:#fff;border:1px solid #EAE7F0;border-radius:16px;padding:16px\">\n          <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:18px\">HOW IT WORKS<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-top:10px;font-size:13px;color:#4A4460;line-height:1.45\"><span style=\"color:#7B3FA4;font-weight:800\">1<\u002Fspan><span>Make a crew of up to 4 — players, fans, captains, anyone with an Umoja account.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-top:8px;font-size:13px;color:#4A4460;line-height:1.45\"><span style=\"color:#7B3FA4;font-weight:800\">2<\u002Fspan><span>Everyone submits from their own phone. Points land automatically or after a quick facilitator review.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-top:8px;font-size:13px;color:#4A4460;line-height:1.45\"><span style=\"color:#7B3FA4;font-weight:800\">3<\u002Fspan><span>Bonus points for creativity and community spirit. Watch the live leaderboard!<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;background:#E2F2EF;border-radius:12px;padding:11px 14px;font-size:12.5px;color:#1E5C50;font-weight:600\">✓ Signed in as Kwame Mensah — you're ready to join<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:14px 20px 8px;font-family:'Barlow Condensed';font-weight:800;font-size:18px\">NAME YOUR CREW<\u002Fdiv>\n      <div style=\"padding:0 20px\">\n        <input value=\"{{ crewName }}\" onchange=\"{{ typeCrewName }}\" placeholder=\"e.g. The Mensah Family\" style=\"width:100%;box-sizing:border-box;padding:14px;border-radius:14px;border:1.5px solid #D9D4E4;font-size:15px;font-family:'Barlow';outline:none;background:#fff\">\n      <\u002Fdiv>\n      <div style=\"padding:14px 20px 8px;font-family:'Barlow Condensed';font-weight:800;font-size:18px\">ADD YOUR CREW <span style=\"font-family:'Barlow';font-weight:500;font-size:13px;color:#6F6981\">({{ crewCount }} of 4 — tap to add)<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;padding:0 20px\">\n        <sc-for list=\"{{ crewPicks }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div onclick=\"{{ c.pick }}\" style=\"display:flex;align-items:center;gap:8px;padding:8px 13px 8px 8px;border-radius:99px;cursor:pointer;background:{{ c.bg }};border:1.5px solid {{ c.border }};opacity:{{ c.opacity }}\">\n            <div style=\"width:26px;height:26px;border-radius:50%;background:{{ c.c }};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:11px\">{{ c.ini }}<\u002Fdiv>\n            <span style=\"font-weight:600;font-size:13.5px\">{{ c.n }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:4px 20px 0;font-size:12px;color:#6F6981\">Only people with Umoja accounts can join — invites go to their app.<\u002Fdiv>\n      <div style=\"padding:16px 20px 24px\">\n        <div onclick=\"{{ createCrew }}\" style=\"background:{{ crewBtnBg }};color:#fff;border-radius:14px;padding:16px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer;transition:background .2s\">CREATE CREW &amp; START<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Joined: missions + leaderboard -->\n    <sc-if value=\"{{ huntMain }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#211A33;color:#fff;padding:58px 16px 18px\">\n        <div onclick=\"{{ back }}\" style=\"font-size:14px;font-weight:600;opacity:.8;cursor:pointer;margin-bottom:10px\">‹ Back<\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n          <div>\n            <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:28px;color:#F2B95B\">THE HUNT<\u002Fdiv>\n            <div style=\"font-size:12.5px;opacity:.8;margin-top:2px\">{{ crewLabel }} · {{ crewMembersLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:right;flex:none\">\n            <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:26px;color:#F2B95B;white-space:nowrap\">{{ huntPts }} pts<\u002Fdiv>\n            <div style=\"font-size:11.5px;opacity:.7;white-space:nowrap\">{{ huntRank }} · {{ huntPendingNote }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:8px;padding:14px 16px 10px\">\n        <sc-for list=\"{{ huntSegs }}\" as=\"s\" hint-placeholder-count=\"2\">\n          <div onclick=\"{{ s.pick }}\" style=\"flex:1;text-align:center;padding:11px 0;border-radius:12px;font-family:'Barlow Condensed';font-weight:800;font-size:15px;letter-spacing:.8px;cursor:pointer;background:{{ s.bg }};color:{{ s.fg }};border:1px solid #EAE7F0\">{{ s.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ huntChallengesView }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;gap:6px;padding:2px 16px 12px;overflow-x:auto\">\n          <sc-for list=\"{{ huntDayChips }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <div onclick=\"{{ d.pick }}\" style=\"flex:none;padding:8px 14px;border-radius:99px;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;background:{{ d.bg }};color:{{ d.fg }};border:1px solid #EAE7F0\">{{ d.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ huntMissions }}\" as=\"h\" hint-placeholder-count=\"6\">\n          <div onclick=\"{{ h.open }}\" style=\"margin:0 16px 8px;background:#fff;border:1.5px solid {{ h.border }};border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;opacity:{{ h.opacity }}\">\n            <div style=\"width:38px;height:38px;border-radius:12px;flex:none;background:#F1EFF5;display:flex;align-items:center;justify-content:center;font-size:17px\">{{ h.icon }}<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-weight:600;font-size:14px;color:{{ h.tc }}\">{{ h.title }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:{{ h.subColor }};font-weight:{{ h.subW }}\">{{ h.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:16px;color:{{ h.ptc }};flex:none\">+{{ h.pts }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"padding:4px 20px 20px;font-size:12px;color:#6F6981\">📸🎥💬 missions go to a facilitator for review · 🧠📍🔲 score instantly. Your best submissions can show up in Fresh Moments!<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ huntBoardView }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin:0 16px;background:#fff;border:1px solid #EAE7F0;border-radius:14px;padding:4px 14px\">\n          <sc-for list=\"{{ huntBoard }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F1EFF5\">\n              <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:17px;color:{{ r.rc }};min-width:26px\">{{ r.rank }}<\u002Fdiv>\n              <div style=\"width:34px;height:34px;border-radius:50%;background:{{ r.c }};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:13px\">{{ r.ini }}<\u002Fdiv>\n              <div style=\"flex:1\"><div style=\"font-weight:{{ r.w }};font-size:14px\">{{ r.name }}<\u002Fdiv><div style=\"font-size:12px;color:#6F6981\">{{ r.done }} missions<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:17px;color:{{ r.rc }}\">{{ r.pts }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"padding:12px 0;font-size:12px;color:#6F6981\">Prizes: $500 grand · $150 runner-up · sponsor gift bags for top 5 · bonus points at facilitator discretion<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:16px\"><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <!-- Mission submit sheet -->\n    <sc-if value=\"{{ msOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;background:rgba(20,15,35,.5);display:flex;align-items:flex-end;z-index:40\" data-screen-label=\"Mission submit\">\n      <div style=\"width:100%;background:#fff;border-radius:22px 22px 0 0;padding:18px 20px 26px;box-sizing:border-box\">\n        <div style=\"width:40px;height:4px;border-radius:99px;background:#D9D4E4;margin:0 auto 14px\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px\">\n          <div style=\"width:36px;height:36px;border-radius:10px;background:#F1EFF5;display:flex;align-items:center;justify-content:center;font-size:16px\">{{ ms.icon }}<\u002Fdiv>\n          <div style=\"flex:1;font-family:'Barlow Condensed';font-weight:800;font-size:20px\">{{ ms.title }}<\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:18px;color:#7B3FA4\">+{{ ms.pts }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#6F6981;line-height:1.5;margin-bottom:14px\">{{ ms.desc }}<\u002Fdiv>\n\n        <sc-if value=\"{{ msMedia }}\" hint-placeholder-val=\"{{ true }}\">\n          <div onclick=\"{{ msSubmitMedia }}\" style=\"background:linear-gradient(120deg,#7B3FA4,#2E6BC0);color:#fff;border-radius:14px;padding:15px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:17px;letter-spacing:1px;cursor:pointer\">{{ ms.mediaCta }}<\u002Fdiv>\n          <div style=\"text-align:center;font-size:12px;color:#6F6981;margin-top:10px\">Goes to a facilitator for review — points land after approval<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ msTrivia }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ msOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <div onclick=\"{{ o.pick }}\" style=\"background:{{ o.bg }};border:1.5px solid {{ o.border }};border-radius:12px;padding:13px 15px;font-weight:600;font-size:14px;cursor:pointer;color:{{ o.fg }}\">{{ o.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"text-align:center;font-size:12px;color:#6F6981;margin-top:10px\">Auto-scored the moment you answer<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ msText }}\" hint-placeholder-val=\"{{ false }}\">\n          <textarea value=\"{{ msAnswer }}\" onchange=\"{{ typeMsAnswer }}\" placeholder=\"Type your answer…\" style=\"width:100%;box-sizing:border-box;min-height:90px;padding:14px;border-radius:14px;border:1.5px solid #D9D4E4;font-size:14.5px;font-family:'Barlow';outline:none;background:#fff;resize:none\"><\u002Ftextarea>\n          <div onclick=\"{{ msSubmitText }}\" style=\"margin-top:12px;background:{{ msTextBtnBg }};color:#fff;border-radius:14px;padding:15px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:17px;letter-spacing:1px;cursor:pointer;transition:background .2s\">SUBMIT ANSWER<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ msInstant }}\" hint-placeholder-val=\"{{ false }}\">\n          <div onclick=\"{{ msSubmitInstant }}\" style=\"background:linear-gradient(120deg,#2C9C90,#2E6BC0);color:#fff;border-radius:14px;padding:15px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:17px;letter-spacing:1px;cursor:pointer\">{{ ms.instantCta }}<\u002Fdiv>\n          <div style=\"text-align:center;font-size:12px;color:#6F6981;margin-top:10px\">Verified on the spot — points land instantly<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ msDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:6px 0 2px\">\n            <div style=\"width:54px;height:54px;margin:0 auto 10px;border-radius:50%;background:{{ msDoneBg }};color:{{ msDoneFg }};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:8
